name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            dependencies: highest
          - php: '8.5'
            dependencies: lowest
          - php: '8.6'
            dependencies: highest
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, simplexml, dom, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction
      - name: Install lowest direct dependencies
        if: matrix.dependencies == 'lowest'
        # Keep transitive dependencies current to avoid upstream PHP deprecations in Psalm.
        run: composer update --root-reqs --prefer-dist --prefer-stable --prefer-lowest --no-interaction
      - run: composer check-platform-reqs
      - run: composer check
